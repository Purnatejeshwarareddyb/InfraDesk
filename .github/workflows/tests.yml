# Continuous integration: runs on every push and pull request. Only free, official actions.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest
        env:
          SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Compose file is valid
        run: docker compose -f docker-compose.yml config --quiet
        env:
          SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789

      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt and validate
        working-directory: infrastructure/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Ansible syntax check and yamllint
        working-directory: infrastructure/ansible
        run: |
          pip install ansible-core yamllint
          for p in preflight deploy validate rollback; do ansible-playbook --syntax-check playbooks/$p.yml; done
          yamllint -d relaxed .

      - name: Shell scripts (shellcheck is preinstalled on the runner)
        run: |
          for f in scripts/*.sh infrastructure/nagios/scripts/*.sh infrastructure/puppet/modules/infradesk_host/files/*.sh; do bash -n "$f"; done
          shellcheck scripts/*.sh infrastructure/nagios/scripts/*.sh infrastructure/puppet/modules/infradesk_host/files/*.sh
