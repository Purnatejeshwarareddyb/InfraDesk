# nginx for InfraDesk: serves the React build and proxies the API (same origin,
# so the HttpOnly session cookie works and no CORS is needed).
# The backend must be reachable under the DNS name "backend" on port 8000
# (service name in docker-compose.yml, network alias in Terraform).

# Security-header value for the Content-Security-Policy.
# The strict policy is the default. The FastAPI /docs page (Swagger UI, bundled locally,
# no CDN) starts with a small inline script, so only that path allows 'unsafe-inline' scripts.
map $request_uri $infradesk_csp {
    default "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    ~^/docs "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'";
}

server {
    listen 8080;
    server_name _;

    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers (no add_header inside locations below, so these are inherited everywhere).
    add_header Content-Security-Policy $infradesk_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Docker's embedded DNS. Using a variable in proxy_pass makes nginx look the name
    # up at request time, so it survives backend restarts (new container IP).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # Used only by the container healthcheck.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API, health endpoints and docs go to FastAPI. Because proxy_pass has a variable and no
    # URI part, the original request URI is passed to the backend unchanged.
    location ~ ^/(api/|health$|ready$|docs|openapi\.json$) {
        proxy_pass $backend_upstream;
        # $http_host keeps the port (localhost:8080); the backend compares the Origin header with Host.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    # Single-page-app fallback: unknown paths return index.html so React Router can handle them.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
