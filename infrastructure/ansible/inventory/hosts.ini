# Inventory: the machines Ansible manages. No passwords or private keys belong in this file.
[infradesk]
# Default: deploy to THIS machine (no SSH involved).
localhost ansible_connection=local

# Example VM (uncomment and edit). Use SSH keys loaded in ssh-agent; never write secrets here.
# infradesk-vm ansible_host=192.168.56.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_ed25519
