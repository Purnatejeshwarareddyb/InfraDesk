# Ansible settings for this project. Run ansible-playbook from this folder (infrastructure/ansible).
# (Ansible ignores an ansible.cfg in a world-writable directory, e.g. a Windows drive mounted in WSL
#  as /mnt/c; keep the repository in the Linux file system, or set ANSIBLE_CONFIG=./ansible.cfg.)
[defaults]
inventory = inventory/hosts.ini
roles_path = roles
retry_files_enabled = False
# Never silently accept unknown SSH hosts for remote VMs.
host_key_checking = True
# Do not print secrets or noisy warnings by default.
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
nocows = True

[privilege_escalation]
# Tasks that need root use `become`; pass -K (--ask-become-pass) to type the sudo password.
become = False
