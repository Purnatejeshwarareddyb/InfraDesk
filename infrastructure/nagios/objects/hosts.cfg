# The monitored machine. Nagios runs on the same machine (127.0.0.1) in the student setup.

define host {
    name                    infradesk-host-template
    use                     generic-host            ; shipped with Nagios Core (sample templates)
    check_period            24x7
    check_interval          1
    retry_interval          1
    max_check_attempts      3
    notification_period     24x7
    notification_interval   0                       ; 0 = notify once per problem, do not repeat
    notification_options    d,r
    contact_groups          infradesk-admins
    register                0
}

define host {
    use                     infradesk-host-template
    host_name               infradesk-host
    alias                   InfraDesk Docker host
    address                 127.0.0.1
    ; ICMP to loopback always works; swap for check_dummy_up if your environment blocks ping.
    check_command           check_host_alive_ping
    ; Where check_infradesk_http.sh lives. Set by install_or_validate.sh (default below).
    _PLUGINDIR              /usr/local/nagios/libexec
}

define hostgroup {
    hostgroup_name          infradesk-hosts
    alias                   InfraDesk hosts
    members                 infradesk-host
}

# Notifications: Nagios only records problems in its log and web UI. No e-mail is promised.
define contact {
    contact_name            infradesk-admin
    alias                   InfraDesk administrator (web UI only)
    host_notifications_enabled      1
    service_notifications_enabled   1
    host_notification_period        24x7
    service_notification_period     24x7
    host_notification_options       d,r
    service_notification_options    w,c,r
    ; "notify-by-log" writes to the Nagios log only. It is defined in commands.cfg below.
    host_notification_commands      notify-by-log
    service_notification_commands   notify-by-log
    ; OPTIONAL: uncomment and set a real address, and configure a mail command, to receive e-mail.
    ; email                         you@example.org
}

define contactgroup {
    contactgroup_name       infradesk-admins
    alias                   InfraDesk administrators
    members                 infradesk-admin
}
