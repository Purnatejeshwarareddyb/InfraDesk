# Command definitions for InfraDesk. $USER1$ is the Nagios plugin directory (resource.cfg).
# The custom plugin is found through the host macro _PLUGINDIR (see hosts.cfg).

# Custom plugin: HTTP check with expected text and warn/crit response times.
define command {
    command_name    check_infradesk_http
    ; args: port, path, expected string, warn seconds, crit seconds
    command_line    $_HOSTPLUGINDIR$/check_infradesk_http.sh -H $HOSTADDRESS$ -p $ARG1$ -u $ARG2$ -e "$ARG3$" -w $ARG4$ -c $ARG5$
}

# Standard plugins (installed with the nagios-plugins package).
define command {
    command_name    check_tcp_port
    command_line    $USER1$/check_tcp -H $HOSTADDRESS$ -p $ARG1$
}

define command {
    command_name    check_local_disk_path
    command_line    $USER1$/check_disk -w $ARG1$ -c $ARG2$ -p $ARG3$
}

define command {
    command_name    check_local_load_avg
    command_line    $USER1$/check_load -w $ARG1$ -c $ARG2$
}

define command {
    command_name    check_local_procs_named
    command_line    $USER1$/check_procs -w $ARG1$ -c $ARG2$ -C $ARG3$
}

define command {
    command_name    check_host_alive_ping
    command_line    $USER1$/check_ping -H $HOSTADDRESS$ -w 100.0,20% -c 500.0,60% -p 1
}

# A host check that always says UP. Use it if ICMP is blocked (e.g. inside some VMs).
define command {
    command_name    check_dummy_up
    command_line    $USER1$/check_dummy 0 "dummy host check: always UP"
}

# Notification command that does nothing. Nagios itself already writes every problem and recovery
# to its log file and shows it in the web UI; that is the only "notification" promised here.
define command {
    command_name    notify-by-log
    command_line    /bin/true
}
