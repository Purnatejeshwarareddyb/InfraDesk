# Services checked on infradesk-host. Intervals are in minutes (interval_length=60 in nagios.cfg).
# Nagios DETECTS and REPORTS. It does not restart anything: recovery is a human running
# infrastructure/ansible/playbooks/rollback.yml (or --tags recover).
# Change the port number 8080 below if INFRADESK_PORT in .env is different.

define service {
    name                    infradesk-service-template
    use                     generic-service         ; shipped with Nagios Core (sample templates)
    check_period            24x7
    check_interval          1                       ; normal check every minute
    retry_interval          1                       ; while a problem is being confirmed
    max_check_attempts      3                       ; 3 bad results in a row = HARD state
    notification_period     24x7
    notification_interval   0
    notification_options    w,c,r
    contact_groups          infradesk-admins
    register                0
}

define service {
    use                     infradesk-service-template
    host_name               infradesk-host
    service_description     InfraDesk /health
    ; port, path, expected text, warn s, crit s
    check_command           check_infradesk_http!8080!/health!ok!2!5
}

define service {
    use                     infradesk-service-template
    host_name               infradesk-host
    service_description     InfraDesk /ready
    check_command           check_infradesk_http!8080!/ready!ready!2!5
}

define service {
    use                     infradesk-service-template
    host_name               infradesk-host
    service_description     TCP port 8080
    check_command           check_tcp_port!8080
}

define service {
    use                     infradesk-service-template
    host_name               infradesk-host
    service_description     Disk /
    check_interval          5
    check_command           check_local_disk_path!20%!10%!/
}

define service {
    use                     infradesk-service-template
    host_name               infradesk-host
    service_description     CPU load
    check_interval          5
    check_command           check_local_load_avg!4,3,2!8,6,4
}

define service {
    use                     infradesk-service-template
    host_name               infradesk-host
    service_description     dockerd process
    check_interval          5
    ; 1 to 3 processes called dockerd is normal; 0 is critical
    check_command           check_local_procs_named!1:3!1:5!dockerd
}
